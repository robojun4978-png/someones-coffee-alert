name: 주간 공고 수집 및 배포
on:
  workflow_dispatch:
  schedule:
    # 월요일 07:00 KST = 일요일 22:00 UTC
    - cron: "0 22 * * 0"
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공고 수집
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
        run: python scripts/collect.py
      - name: 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          git diff --cached --quiet || git commit -m "주간 지원사업 데이터 업데이트"
          git push
      - name: Pages 설정
        uses: actions/configure-pages@v5
      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: GitHub Pages 배포
        uses: actions/deploy-pages@v5
        id: deployment
